# ============================================================
#  8111 for WoWS -- in-game collector (WowsExtractor) settings
# ------------------------------------------------------------
#  Copy this file to config.ini and edit values for your machine.
#  This file is read by Main.py from its OWN folder, so it must
#  sit next to Main.py inside:
#     World_of_Warships/bin/<build>/res_mods/PnFMods/WowsExtractor/
#  A missing or malformed file disables collection. Collection is opt-in.
#  Changes are picked up at the start of the next battle (no game restart).
#  Format: one "key = value" per line; '#' or ';' starts a comment.
# ============================================================

# Set true only when telemetry collection is explicitly wanted.
collection_enabled = false

# Expensive UI/dataHub candidate probes. Requires collection_enabled = true.
diagnostics_enabled = false

# Independent self-submarine raw candidate sampling. All require collection_enabled=true.
# Depth and WaveHit use the core state cadence (default 5 Hz); Battery shares
# the existing average 1 Hz comparison cadence. Each option is independent and OFF by default.
self_depth_sampling_enabled = false
battery_sampling_enabled = false
wave_hit_sampling_enabled = false

# Independent raw gun reload candidates. Requires collection_enabled=true.
# Samples at the core state cadence (default 5 Hz); modifier getEntity lookup is skipped.
gun_reload_sampling_enabled = false

# Independent, depth-only sampling of fixed dataHub.torpedo.depth candidate.
# This works with diagnostics_enabled=false, but still requires collection_enabled=true.
# The local GUI Components.xml defines Torpedo.depth:Number sync=false; Python
# availability and meaning are unverified, so unit is emitted as null.
torpedo_depth_sampling_enabled = false

# Depth sampling interval; invalid values use 1.0s and the enforced minimum is 1.0s.
# When depth and the heavy diagnostics are due together, torpedo collection access
# is shared within that state sample (the heavy diagnostics remain independently opt-in).
torpedo_depth_sampling_interval = 1.0

# Independent fixed-field UI torpedo state candidates (isHoming/isSpotted).
# This does not depend on diagnostics_enabled, but still requires collection_enabled=true.
# GUI/ATM interpretation and Python exposure can vary; producer/semantics stay unknown.
torpedo_state_sampling_enabled = false

# Declared origin of the state candidates above. It never enables sampling.
# Allowed values: unknown (default), advanced_torpedo_marker.
# advanced_torpedo_marker records the user's declaration only. The runtime
# producer cannot be verified from the generic mods_DataComponent field, so
# output stays third-party derived: isSpotted is a client-side estimate and
# isHoming is a third-party guidance assessment, not server raw state.
torpedo_state_provider = unknown

# State sampling interval; invalid values use 1.0s and the enforced minimum is 1.0s.
# The sampler reads only the two fixed flags and shares same-sample torpedo collection access.
torpedo_state_sampling_interval = 1.0

# --- 0.3.41 team-torpedo-budget policy (optional, works without any UI mod) ---
# Nearest-enemy high-rate classification: only the closest enemy torpedoes inside
# the radius keep the 5 Hz high group; farther or over-budget enemies drop to the
# average 2 Hz low group. Own torpedoes (owner.isPlayer is true) and safety rows
# are always high and are never counted against this budget.
#
# Classification radius = min(map_width, map_height) / this divisor. Default 5
# (the historical L/5 radius). Allowed 1.0-100.0; invalid values use the default.
torpedo_sampling_radius_divisor = 5

# Number of nearest in-range enemy torpedoes kept high. Default 20. Allowed
# 1-512; invalid values use the default. The research-only variant used 25.
torpedo_sampling_enemy_high_budget = 20

# The optional, self-authored TTaro Mod Config panel (schema shipped at
# res_mods/ModSchemas/kitta-wows-extractor.schema.json) exposes ONLY these two
# knobs, with a narrower UI range: enemyHighBudget 1-64, radiusDivisor 2.0-10.0.
# Panel input is clamped to that UI safe range. These broader ini values are NOT
# folded into the UI range and stay in effect whenever the panel/framework is
# absent (no periodic enumeration; it is bound once at load-complete).

# Opt-in bounded game-thread phase summaries. Requires collection_enabled=true.
# Candidate timer support and behavior are not yet verified in the game runtime.
profiler_enabled = false

# Legacy world-position fallback is diagnostic-only and sampled only when due.
# Even when true, it never runs unless diagnostics_enabled = true.
position_fallbacks_enabled = false

# Minimum interval between complete diagnostics samples (not FPS-validated).
# Non-due state snapshots carry status=notSampled, not an older probe payload.
diagnostics_interval = 1.0

# Seconds between state.json writes when collection is enabled.
#   0.1  = 10  Hz  (compatibility option; about twice the scheduled samples)
#   0.15 = ~6.7 Hz (lighter; minimap updates slightly slower)
#   0.2  = 5   Hz  (default; every snapshot stays internally consistent)
# Minimum enforced in code is 0.02 (50 Hz) to protect the disk.
state_interval = 0.2

# --- 0.3.45 slow information groups ---
# These groups lower the read frequency for specific heavy fields while keeping
# the minimap/visibility/id fields on the core cadence. Each group is independent.
# Setting enabled=false reverts that group to the core cadence (it is not disabled).

# Self-ship systems (radar/hydro/locator/consumables). Default 1 Hz.
self_systems_sampling_enabled = true
self_systems_sampling_interval = 1.0

# Own torpedo armament modules. Default 1 Hz.
torpedo_armament_sampling_enabled = true
torpedo_armament_sampling_interval = 1.0

# Heavy map-calibration diagnostics snapshot (span, rmse, holdout). Default 1 Hz.
# This is independent of diagnostics_enabled so the snapshot is emitted even when
# the heavy diagnostics group is OFF; live model coefficients stay on the core path.
map_calibration_snapshot_interval = 1.0

# Far-ship world position/yaw. Minimap nx/ny/visibility/IDs stay core. Far is
# defined by the calibrated map radius / divisor. Default 1 Hz, divisor 5 (L/5).
ship_world_position_sampling_enabled = true
ship_world_position_sampling_interval = 1.0
ship_world_position_far_divisor = 5.0
