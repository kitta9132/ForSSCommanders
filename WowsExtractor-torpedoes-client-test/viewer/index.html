<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>簡易2Dマップ</title><style>
body{background:#101b25;color:#e8f1f5;font:14px system-ui,sans-serif;margin:1em}h1{font-size:1.3em}main{display:flex;gap:1em;flex-wrap:wrap}canvas{width:min(76vw,680px);height:min(76vw,680px);background:#102e40;border:1px solid #86a6b6;cursor:crosshair}aside{max-width:450px;white-space:pre-wrap;overflow-wrap:anywhere}#status{color:#ffd477;min-height:3em}.legend{line-height:1.7}button{margin-left:1em}
</style></head><body>
<h1>簡易2Dマップ <small>座標・軸・鮮度は未検証</small></h1>
<div id="status">接続中…</div><main><canvas id="map" width="680" height="680"></canvas><aside><div class="legend">凡例: <span style="color:#fff">● 自艦</span> / <span style="color:#66dcff">● 味方</span> / <span style="color:#ff7474">● 敵</span> / <span style="color:#e4d790">● 不明</span><br>◆ 魚雷 / ○ 最終目撃 / ● 地図位置候補（現在可視とは限らない）<br>矢印は観測した地図座標差分の方向（船首方向ではない）。</div><h2>選択詳細</h2><div id="detail">マーカーをクリック</div></aside></main>
<script>
'use strict';
const canvas=document.querySelector('#map'), ctx=canvas.getContext('2d'), status=document.querySelector('#status'), detail=document.querySelector('#detail');
let previous=null, retained=null, selected=null, markers=[], lastKey=null;
let torpedoSamples=new Map();
const num=x=>typeof x==='number'&&Number.isFinite(x);
const pair=(x,y)=>num(x)&&num(y)?[x,y]:null;
const val=x=>x===null||x===undefined?'unknown':String(x);
function inverse(pos,cal){
  if(cal?.status!=='available')return null;
  if(!Array.isArray(pos)||!num(pos[0])||!num(pos[2]))return null;
  const c=cal?.coefficients, x=c?.worldX,z=c?.worldZ;
  if(!x||!z||!['nx','ny'].includes(x.mapAxis)||!['nx','ny'].includes(z.mapAxis)||x.mapAxis===z.mapAxis||![x.scale,x.offset,z.scale,z.offset].every(num)||x.scale===0||z.scale===0)return null;
  const p={};p[x.mapAxis]=(pos[0]-x.offset)/x.scale;p[z.mapAxis]=(pos[2]-z.offset)/z.scale;return pair(p.nx,p.ny);
}
function torpedoKey(t){
  if(Array.isArray(t))t={uiId:t[0],ownerId:t[1],shotId:t[2]};
  const valid=x=>x===null||typeof x==='string'||num(x);
  return t?.uiId!=null&&[t.uiId,t.ownerId??null,t.shotId??null].every(valid)?
    JSON.stringify([t.uiId,t.ownerId??null,t.shotId??null]):null;
}
function sampledTorpedoes(state){
  const rows=state?.torpedoes||[], s=state?.torpedoStatus;
  if(!s?.sampling){torpedoSamples.clear();return rows;}
  const counts=new Map();
  for(const item of s.membership||[]){const key=torpedoKey(item);if(key!==null)counts.set(key,(counts.get(key)||0)+1);}
  if(s.membershipComplete===true){
    for(const key of torpedoSamples.keys())if(counts.get(key)!==1)torpedoSamples.delete(key);
  }
  const current=new Set();
  for(const row of rows){const key=torpedoKey(row);if(key!==null){current.add(key);
    if(row.sampling?.group==='low'&&counts.get(key)===1){
      const old=torpedoSamples.get(key);
      if(old?.row.sampling?.sampleTs!==row.sampling?.sampleTs)torpedoSamples.set(key,{row,wallTs:Date.now()});
    }else torpedoSamples.delete(key);}}
  const out=rows.slice();
  for(const [key,entry] of torpedoSamples){
    const row=entry.row, wallAge=Date.now()-entry.wallTs;
    const age=num(state.ts)&&num(row.sampling?.sampleTs)?state.ts-row.sampling.sampleTs:null;
    // Last samples are app-side history, not freshly collected positions.
    if(age===null||age<0||age>1.5||wallAge<0||wallAge>1500){torpedoSamples.delete(key);continue;}
    if(!current.has(key))out.push({...row,viewerSampleHeld:true});
  }
  return out;
}
function draw(snapshot, networkError=false){
  const wrap=snapshot?.state, incoming=wrap?.data;
  if(incoming?.active===true){
    const key=incoming.battleId;
    if(lastKey!==key){previous=null;retained=null;selected=null;lastKey=key;torpedoSamples.clear();}
    retained={state:incoming,meta:snapshot.metaMatches?snapshot.meta.data:null};
  } else if(incoming?.active===false && retained && incoming.battleId!==retained.state.battleId){retained=null;previous=null;selected=null;lastKey=null;torpedoSamples.clear();}
  const state=incoming?.active===true?incoming:retained?.state;
  const meta=incoming?.active===true?(snapshot.metaMatches?snapshot.meta.data:null):retained?.meta;
  const inactive=incoming?.active===false;
  if(inactive)torpedoSamples.clear();
  const stale=networkError||!wrap||wrap.stale||inactive;
  let notices=[networkError?'通信失敗：最後の正常データは古い':wrap?.error?'読取失敗：最後の正常データは古い':wrap?.stale?'更新停止：古いデータ':'更新中'];
  if(inactive)notices.push('inactive / 戦闘終了：最後の戦闘表示（現在情報ではない）');
  if(!state)notices.push('表示可能な戦闘データなし');
  if(incoming?.active===true&&!snapshot.metaMatches)notices.push('meta未取得またはbattleId不一致：結合しない');
   if(snapshot?.metaMatches&&snapshot.meta.stale)notices.push('meta更新から3秒超（戦闘内固定情報）');
  const cal=state?.diag?.mapCalibration;
  notices.push('較正: '+val(cal?.status)+(cal?.coefficients?'（係数あり・推定）':'（未成立/係数なし）'));
  notices.push('魚雷取得: '+val(state?.torpedoStatus?.status)+' / state経過秒: '+(num(wrap?.ageSeconds)?wrap.ageSeconds.toFixed(1):'unknown'));
  if(state?.torpedoStatus?.sampling)notices.push('魚雷は周期別sample：遠距離の前回観測は最大1.5秒表示（現在位置ではない）');
  if(meta?.map)notices.push('地図: '+val(meta.map.mapName??meta.map.name??meta.map.id));
  ctx.clearRect(0,0,680,680);ctx.strokeStyle='#416170';ctx.lineWidth=1;
  for(let i=0;i<=10;i++){let p=i*68;ctx.beginPath();ctx.moveTo(p,0);ctx.lineTo(p,680);ctx.moveTo(0,p);ctx.lineTo(680,p);ctx.stroke();}
  markers=[];let outside=0, missing=0;const current={};
  function add(kind,obj,p,source,ghost,id,color){
    if(!p){missing++;return}if(p.some(v=>v<0||v>1)){outside++;return}
    const x=p[0]*680,y=p[1]*680,key=kind+':'+id+(ghost?':ghost':'');
    ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2;ctx.beginPath();
    if(kind==='torpedo'){ctx.moveTo(x,y-6);ctx.lineTo(x+6,y);ctx.lineTo(x,y+6);ctx.lineTo(x-6,y);ctx.closePath();ctx.fill();}
    else {ctx.arc(x,y,ghost?7:5,0,2*Math.PI);ghost?ctx.stroke():ctx.fill();}
    if(id!=null&&!ghost&&!stale){current[key]=p;const old=previous?.[key];if(old){const dx=p[0]-old[0],dy=p[1]-old[1],len=Math.hypot(dx,dy);if(len>0.0001){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx/len*16,y+dy/len*16);ctx.stroke();}}}
    markers.push({x,y,kind,obj,source,ghost,key});
  }
  for(const s of state?.ships||[]){
    const own=state.self?.playerId!=null&&s.playerId===state.self.playerId;
    const color=own?'#ffffff':s.relation===1?'#66dcff':s.relation===2?'#ff7474':'#e4d790';
    const p=pair(s.nx,s.ny);
    add(own?'self':'ship',s,p,'nx/ny 取得座標（鮮度未検証）',false,s.uiId??s.vehicleId??s.playerId,color);
  }
  if(state?.torpedoStatus?.available===true)for(const t of (inactive?(state.torpedoes||[]):sampledTorpedoes(state))){
    const direct=Array.isArray(t.mapPosition)?pair(t.mapPosition[0],t.mapPosition[1]):null;
    add('torpedo',t,direct||inverse(t.position,cal),(direct?'mapPosition（較正による推定）':'較正係数逆変換（推定）')+(t.viewerSampleHeld?' / 前回sample位置':''),false,t.uiId,t.isOwn===true?'#ffffff':t.relation===1?'#66dcff':t.relation===2?'#ff7474':'#e4d790');
  }
  if(!stale)previous=current;else previous=null;
  if(outside)notices.push('範囲外の座標 '+outside+' 件は非表示（clampなし）');
  if(missing)notices.push('座標不明 '+missing+' 件は非表示');
  status.textContent=notices.join(' ｜ ');
  if(selected){const m=markers.find(x=>x.key===selected);if(m)show(m,stale);else detail.textContent='選択対象は現在の表示にありません';}
}
function show(m,stale){
  const o=m.obj, u=o.uiState||{};let lines=[m.kind+(m.ghost?' / 最終目撃':''), '位置: '+m.source, '状態: '+(stale?'古い / inactive の可能性あり':'最新取得（鮮度は未検証）')];
  if(m.kind==='torpedo')lines.push('sample: '+val(o.sampling?.group)+' / ts '+val(o.sampling?.sampleTs)+(o.viewerSampleHeld?'（前回取得を表示・現在位置ではない）':''),'API type: '+val(o.type),'UI type: '+val(u.uiType),'UI isHoming: '+val(u.isHoming),'UI isSpotted: '+val(u.isSpotted),'UI供給者: unknown（ATM構成由来の可能性）');
   else lines.push('艦種: '+val(o.shipType),'HP: '+val(o.health)+' / '+val(o.maxHealth),'relation: '+val(o.relation),'visible: '+val(o.visible)+'（現在可視の保証なし）','world position source: '+val(o.positionSource)+(o.positionSource==='calibratedMapPosition'?'（推定）':''),'最終目撃時刻: '+val(o.lastSeenTs));
  detail.textContent=lines.join('\n');
}
canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*680/r.width,y=(e.clientY-r.top)*680/r.height;let nearest=null,d=14;for(const m of markers){const n=Math.hypot(m.x-x,m.y-y);if(n<d){d=n;nearest=m;}}selected=nearest?.key??null;if(nearest)show(nearest,document.querySelector('#status').textContent.includes('古い')||document.querySelector('#status').textContent.includes('inactive'));else detail.textContent='マーカーをクリック';});
let snapshot=null;async function poll(){try{const r=await fetch('/api/snapshot',{cache:'no-store'});if(!r.ok)throw Error();snapshot=await r.json();draw(snapshot);}catch(e){draw(snapshot,true);}setTimeout(poll,200);}poll();
</script></body></html>
